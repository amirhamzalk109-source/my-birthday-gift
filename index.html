<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-in-out;
            padding: 20px;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        /* Passcode Screen */
        .passcode-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }

        .passcode-box h2 {
            color: #d63384;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .passcode-box input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #ff758c;
            border-radius: 10px;
            margin-bottom: 15px;
            outline: none;
            letter-spacing: 3px;
        }

        .passcode-box button {
            background-color: #ff4b5c;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .error-msg {
            color: red;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        /* Main Menu / Gift Boxes */
        .menu-container {
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        .menu-container h1 {
            font-family: 'Sacramento', cursive;
            font-size: 3.5rem;
            color: #c2185b;
            margin-bottom: 20px;
        }

        .grid-boxes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .gift-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
            text-align: center;
            font-weight: 600;
            color: #d81b60;
        }

        .gift-box:hover {
            transform: scale(1.05);
            background: white;
        }

        /* Popup Content Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-content img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .close-btn {
            background: #ff4b5c;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Screen 1: Passcode Lock (23122024) -->
    <div id="passcodeScreen" class="screen">
        <div class="passcode-box">
            <h2>🔒 Enter 8-Digit Passcode</h2>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 15px;">Hint: Tomader special date</p>
            <input type="password" id="passInput" placeholder="********" maxlength="8">
            <br>
            <button onclick="checkPasscode()">Open Gift ❤️</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>

    <!-- Screen 2: Main Surprise Menu -->
    <div id="mainScreen" class="screen hidden">
        <div class="menu-container">
            <h1>Happy Birthday, Queen! 🎉</h1>
            <p style="color: #444; margin-bottom: 15px;">Choose a gift box below to unlock your surprises:</p>
            <div class="grid-boxes">
                <div class="gift-box" onclick="openModal('cake')">🎂 Birthday Cake</div>
                <div class="gift-box" onclick="openModal('letter')">💌 Deepest Note</div>
                <div class="gift-box" onclick="openModal('anya')">✨ Anya's Waku Waku</div>
                <div class="gift-box" onclick="openModal('shinchan')">🎈 Shinchan's Joy</div>
            </div>
        </div>
    </div>

    <!-- Modal Popup -->
    <div id="popupModal" class="modal hidden">
        <div class="modal-content" id="modalBody">
            <!-- Dynamic content -->
        </div>
    </div>

    <script>
        const secretCode = "23122024"; 

        function checkPasscode() {
            const entered = document.getElementById('passInput').value;
            if(entered === secretCode) {
                document.getElementById('passcodeScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').innerText = "Wrong passcode! Try again my love ❤️";
            }
        }

        function openModal(type) {
            const modal = document.getElementById('popupModal');
            const body = document.getElementById('modalBody');
            modal.classList.remove('hidden');

            if(type === 'cake') {
                body.innerHTML = `
                    <h2 style="color:#d63384; margin-bottom:10px;">Make a Magical Wish! 🎂</h2>
                    <img src="https://media.giphy.com/media/Lndu0G2f4M2B32M4a5/giphy.gif" alt="Cake">
                    <p style="color:#555; font-size:0.9rem; line-height:1.5;">Blow out the candles, my fierce Scorpio queen. May all your secret dreams and ambitions come true this year. I'm always right here by your side! ✨</p>
                    <button class="close-btn" onclick="closeModal()">Close</button>
                `;
            } else if(type === 'letter') {
                body.innerHTML = `
                    <h2 style="font-family:'Sacramento', cursive; color:#c2185b; font-size:2.3rem;">To My Entire World,</h2>
                    <p style="color:#4a4a4a; font-size:0.88rem; line-height:1.6; text-align:justify; margin:6px 0;">
                        You are the most mesmerizing, loyal, and breathtaking soul I have ever known. Loving you is the easiest and most beautiful thing that has ever happened to me. Thank you for making my life complete with your fierce love. Happy Birthday, my absolute everything! ❤️🔥
                    </p>
                    <button class="close-btn" onclick="closeModal()">Close</button>
                `;
            } else if(type === 'anya') {
                body.innerHTML = `
                    <h2 style="color:#d63384; margin-bottom:10px;">Anya's Waku Waku! ✨</h2>
                    <img src="https://media.giphy.com/media/Xb9q1Xla91o5p9c58p/giphy.gif" alt="Anya">
                    <p style="color:#555; font-size:0.9rem; line-height:1.5;">Anya reads your mind and knows you are the prettiest, smartest, and most special girl in the whole universe! Waku waku! 😍</p>
                    <button class="close-btn" onclick="closeModal()">Close</button>
                `;
            } else if(type === 'shinchan') {
                body.innerHTML = `
                    <h2 style="color:#d63384; margin-bottom:10px;">Shinchan's Celebration! 🎈</h2>
                    <img src="https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif" alt="Shinchan">
                    <p style="color:#555; font-size:0.9rem; line-height:1.5;">Sending infinite hugs, endless smiles, and all my heart straight to your birthday! Let's celebrate your special day forever! 🎉💖</p>
                    <button class="close-btn" onclick="closeModal()">Close</button>
                `;
            }
        }

        function closeModal() {
            document.getElementById('popupModal').classList.add('hidden');
        }
    </script>
</body>
</html>
